name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the Meadowvale server
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then echo "Set the SERVER_URL repository variable"; exit 1; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$SERVER_URL/api/health"
